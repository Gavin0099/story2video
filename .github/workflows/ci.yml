name: M0 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      - name: Install uv
        run: python -m pip install uv==0.13.9
      - name: Test Python CLI, schema, and SQLite
        run: |
          uv sync --locked
          uv run --locked pytest
        shell: bash
      - name: Check WhyNest Lab script batches and review evidence
        run: |
          python -X utf8 experiments/science-shorts/script-library/batch-001/verify.py --batch batch-001
          python -X utf8 experiments/science-shorts/script-library/batch-001/verify.py --batch batch-002
          python -X utf8 experiments/science-shorts/script-library/batch-001/verify.py --batch batch-003
          python -X utf8 experiments/science-shorts/script-library/batch-001/verify.py --batch batch-004
          python -X utf8 experiments/science-shorts/script-library/batch-001/verify.py --batch batch-005
          python -X utf8 experiments/science-shorts/script-library/batch-001/verify.py --batch batch-006
        shell: bash
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install and check TypeScript workspace
        working-directory: video
        run: |
          npm ci
          npm run typecheck
        shell: bash

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$archive"
          sha256='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
