name: Governance Drift

on:
  push:
    paths:
      - ".github/workflows/governance-drift.yml"
      - ".governance/**"
      - ".governance-payload-config.yaml"
      - ".gitmodules"
      - "AGENTS.base.md"
      - "AGENTS.md"
      - "PLAN.md"
      - "additional/ai-governance-framework"
      - "contract.yaml"
      - "governance/**"
      - "memory/**"
      - "pyproject.toml"
      - "src/story2video/domain/**"
      - "src/story2video/schemas/**"
      - "tests/fixtures/**"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/governance-drift.yml"
      - ".governance/**"
      - ".governance-payload-config.yaml"
      - ".gitmodules"
      - "AGENTS.base.md"
      - "AGENTS.md"
      - "PLAN.md"
      - "additional/ai-governance-framework"
      - "contract.yaml"
      - "governance/**"
      - "memory/**"
      - "pyproject.toml"
      - "src/story2video/domain/**"
      - "src/story2video/schemas/**"
      - "tests/fixtures/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install governance dependencies
        run: |
          python -m pip install uv==0.13.9
          uv sync --locked --group governance
      - name: Run governance drift check
        run: |
          uv run --locked --group governance python -X utf8 additional/ai-governance-framework/governance_tools/governance_drift_checker.py \
            --repo . \
            --framework-root additional/ai-governance-framework \
            --format human
      - name: Verify Episode contract against the pinned framework
        run: uv run --locked --group governance python governance/verify.py
