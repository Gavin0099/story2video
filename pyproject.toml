[project]
name = "story2video"
version = "0.1.0"
description = "Local foundations for a reproducible video production workflow."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["jsonschema>=4.25,<5"]

[project.scripts]
s2v = "story2video.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
